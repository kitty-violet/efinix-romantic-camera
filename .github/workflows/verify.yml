name: Repository integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out files and LFS pointers
        uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify manifest, pointers, and documentation
        run: python -B scripts/verify_repository.py --allow-lfs-pointers
